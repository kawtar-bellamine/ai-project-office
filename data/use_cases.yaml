  - id: UC09
    nom: Prévision des pannes d'équipements instrumentés
    metier: Maintenance industrielle
    utilisateurs: Ingénieurs fiabilité
    probleme: Les arrêts non planifiés coûtent cher et les signaux faibles ne sont pas exploités.
    technique: ml_predictif
    volume_mois: 0
    minutes_gagnees: 0
    adoption: 0.6
    autre_gain_eur_an: 120000
    donnees: 1
    complexite: 3
    risque: 2
    jours_realisation: 120
    run_eur_an: 15000
    critere_succes: Panne annoncée au moins 48 h à l'avance pour la moitié des défaillances, moins d'une fausse alarme par semaine.
  - id: UC10
    nom: Rédaction des comptes rendus de réunion de chantier
    metier: Travaux
    utilisateurs: Conducteurs de travaux
    probleme: Les comptes rendus sont rédigés le soir à partir de notes manuscrites.
    technique: llm_generation
    volume_mois: 1500
    minutes_gagnees: 10
    adoption: 0.5
    autre_gain_eur_an: 0
    donnees: 3
    complexite: 1
    risque: 1
    jours_realisation: 35
    run_eur_an: 12000
    critere_succes: Compte rendu validé avec moins de 3 corrections dans 80 % des cas.
